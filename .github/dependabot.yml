version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      next-react:
        patterns: ['next', 'react', 'react-dom', '@types/react*', 'eslint-config-next', '@next/*']
      tooling:
        patterns:
          [
            'eslint*',
            '@eslint/*',
            'typescript*',
            'prettier',
            'vitest',
            '@vitest/*',
            '@playwright/test',
            'tsx',
            'esbuild',
          ]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly
