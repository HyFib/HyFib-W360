name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres

jobs:
  quality:
    name: Lint, types, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: Integration (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ['17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  build:
    name: Build web and worker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e:
    name: End-to-end (Chromium, Firefox, WebKit, mobile)
    runs-on: ubuntu-24.04
    # Tests run one at a time across four browser projects: 344 took 127.3 minutes on 3695c23, 340
    # took 120.3 to 127.6 on cecf550, 2e74750 and a2df990, 260 took 91.1 on 57bc896, 224 took 71.1
    # on aceb7a0, 220 took 65.3 on c1b45aa, 216 took 61.2 on 76b0eff, 212 took 64.0 on afcb21d and
    # 61.0 on b453b6c, 208 took 66.5 on da91fc3 (one flaky test passed on its retry on b453b6c and
    # da91fc3), 200 took 64.3 on 28a774c and 180 took 54.0 on 736acb4. The usage, settlement, API
    # key and refund request specs each wait per project for a worker's minute sweep to send an
    # email: the rate change notice (since 3978329) and the key expiry reminder up to 90 seconds,
    # the reconciliation and unsettled payment alerts, which go to every platform owner, up to 150;
    # the refund request test waits for three sweeps (about 2 minutes), the plans test for two staff
    # plan changes' emails and the plan subscription test for a staff cancellation's (ADR-100,
    # ADR-101), and the two WhatsApp access tests for the sweep to check an account never checked
    # (about a minute each, ADR-137). Runners vary (148 tests took 33.5 minutes on b2b7614; 160 took
    # 45.9 on fb8efa6, including a 4-minute timeout and its retry), each slice adds about 4 tests,
    # and one retry of a long test (the cart reminder test allows 5 minutes) must still fit on a
    # slow runner: the suite step stops at 180 minutes, the job at 190.
    timeout-minutes: 190
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: w360
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    env:
      APP_ENV: test
      APP_BASE_URL: http://localhost:3000
      DATABASE_URL_APP: postgres://w360_app:dev-only-app@localhost:5432/w360
      DATABASE_URL_AUTH: postgres://w360_auth:dev-only-auth@localhost:5432/w360
      DATABASE_URL_PLATFORM: postgres://w360_platform:dev-only-platform@localhost:5432/w360
      DATABASE_URL_MIGRATE: postgres://w360_owner:dev-only-owner@localhost:5432/w360
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      EMAIL_FROM: no-reply@localhost
      W360_ENCRYPTION_PRIMARY_KEY_ID: ci
      E2E_DATABASE_URL_AUTH: postgres://w360_auth:dev-only-auth@localhost:5432/w360
      # Test-only Meta configuration: the worker talks to the local Graph stand-in started by the
      # Playwright global setup (a non-Meta Graph origin is refused outside APP_ENV=local|test).
      META_APP_ID: '1000000000001'
      META_GRAPH_API_VERSION: v26.0
      META_WEBHOOK_VERIFY_TOKEN: e2e-verify-token
      META_GRAPH_BASE_URL: http://127.0.0.1:4010
      E2E_GRAPH_PORT: '4010'
      RAZORPAY_API_BASE_URL: http://127.0.0.1:4020
      E2E_RAZORPAY_PORT: '4020'
      # Paying for plans (ADR-063) against the stand-in's subscriptions; off unless set.
      RAZORPAY_SUBSCRIPTIONS_ENABLED: 'true'
      # Automation web requests reach a local target started by the test: loopback egress is
      # allowed for APP_ENV=local|test only, and the name below resolves to 127.0.0.1 (hosts file).
      W360_EGRESS_ALLOW_LOOPBACK: 'true'
      E2E_HTTP_HOST: api.w360-e2e.test
      # Test-only Shopify app: web and worker talk to the local Shopify stand-in started by the
      # Playwright global setup (SHOPIFY_TEST_BASE_URL is refused outside APP_ENV=local|test).
      # WooCommerce sites are addressed by URL; their stand-in needs only a port (and the loopback
      # egress above).
      SHOPIFY_CLIENT_ID: w360e2eshopify01
      SHOPIFY_API_VERSION: '2026-07'
      SHOPIFY_TEST_BASE_URL: http://127.0.0.1:4030
      E2E_SHOPIFY_PORT: '4030'
      E2E_WOO_PORT: '4040'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Resolve the web request test host to loopback
        run: echo "127.0.0.1 $E2E_HTTP_HOST" | sudo tee -a /etc/hosts
      - run: pnpm install --frozen-lockfile
      - name: Generate ephemeral CI secrets
        run: |
          echo "W360_ENCRYPTION_KEYS=ci:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "W360_JOB_SIGNING_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "META_APP_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "RAZORPAY_KEY_ID=rzp_test_$(openssl rand -hex 8)" >> "$GITHUB_ENV"
          echo "RAZORPAY_KEY_SECRET=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "RAZORPAY_WEBHOOK_SECRET=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "SHOPIFY_CLIENT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Bootstrap roles and migrate
        run: |
          psql postgres://postgres:postgres@localhost:5432/w360 -v ON_ERROR_STOP=1 -v db_name=w360 \
            -v owner_password=dev-only-owner -v app_password=dev-only-app -v auth_password=dev-only-auth \
            -v platform_password=dev-only-platform -f infra/db/bootstrap-roles.sql
          pnpm db:migrate
      - run: pnpm build
      - name: Start web and worker
        run: |
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          cp -r apps/web/public apps/web/.next/standalone/apps/web/public
          (cd apps/web/.next/standalone && nohup node apps/web/server.js > "$RUNNER_TEMP/web.log" 2>&1 &)
          (cd apps/worker && NODE_ENV=production nohup node dist/main.js > "$RUNNER_TEMP/worker.log" 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health/ready && curl -sf http://localhost:9464/ready && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/web.log" "$RUNNER_TEMP/worker.log"; exit 1
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      # Stops before the job's limit, so a run that overruns still gets the steps below.
      - run: pnpm test:e2e
        timeout-minutes: 180
      - if: failure() || cancelled()
        run: cat "$RUNNER_TEMP/web.log" "$RUNNER_TEMP/worker.log"
      # Test data only: what the job queues and the stores held when the suite failed.
      - name: Job, store and database state after a failure
        if: failure() || cancelled()
        run: |
          psql postgres://postgres:postgres@localhost:5432/w360 -P pager=off <<'SQL'
          SELECT name, state, count(*) FROM pgboss.job GROUP BY 1, 2 ORDER BY 1, 2;
          SELECT name, id, state, retry_count, created_on, started_on, completed_on,
                 output->>'name' AS error, left(output->>'message', 300) AS message
            FROM pgboss.job
           WHERE state IN ('retry', 'active', 'failed') AND name <> 'dead-letter'
           ORDER BY created_on DESC LIMIT 60;
          SELECT source_name, created_on, output->>'name' AS error, left(output->>'message', 300) AS message
            FROM pgboss.job WHERE name = 'dead-letter' ORDER BY created_on DESC LIMIT 30;
          SELECT id, platform, state, lease_until, next_sync_at, synced_at, checkouts_read_at,
                 left(sync_error, 200) AS sync_error, left(checkouts_error, 200) AS checkouts_error
            FROM app.commerce_stores ORDER BY created_at DESC LIMIT 12;
          SELECT pid, application_name, state, wait_event_type, wait_event, now() - xact_start AS xact_age,
                 now() - query_start AS query_age, left(query, 200) AS query
            FROM pg_stat_activity WHERE datname = 'w360' AND state <> 'idle' AND pid <> pg_backend_pid();
          SQL
      # Kept for every run: a test that passed on retry leaves a green job, and its failed attempt's
      # trace (test-results, also when the HTML report was not written) and the server logs of the
      # same window are the only evidence of what went wrong.
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # A re-run is the same workflow run: one name per attempt keeps both attempts' evidence.
          name: playwright-report-${{ github.run_attempt }}
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-server-logs-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/web.log
            ${{ runner.temp }}/worker.log
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - name: Secret scan (gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source /repo --no-banner --redact
